name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download hev-socks5-tunnel binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          wget -q https://github.com/heiher/hev-socks5-tunnel/releases/download/2.10.3/hev-socks5-tunnel-android-arm64 -O app/src/main/jniLibs/arm64-v8a/libhev_socks5_tunnel.so
          wget -q https://github.com/heiher/hev-socks5-tunnel/releases/download/2.10.3/hev-socks5-tunnel-android-arm -O app/src/main/jniLibs/armeabi-v7a/libhev_socks5_tunnel.so
          chmod +x app/src/main/jniLibs/*/*.so
          file app/src/main/jniLibs/arm64-v8a/libhev_socks5_tunnel.so
          file app/src/main/jniLibs/armeabi-v7a/libhev_socks5_tunnel.so

      - name: Make gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SentinelVPN-apk
          path: app/build/outputs/apk/release/*.apk
